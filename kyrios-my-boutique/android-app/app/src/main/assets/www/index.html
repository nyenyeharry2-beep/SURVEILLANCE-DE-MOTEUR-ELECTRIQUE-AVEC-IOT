<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kyrios My Boutique</title>
<style>
:root{--p:#6366f1;--pd:#4f46e5;--bg:#f0f2f5;--card:#fff;--text:#1c1e21;--muted:#65676b;--border:#dddfe2;--ok:#22c55e;--err:#ef4444}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
.hidden{display:none!important}
#app{max-width:480px;margin:0 auto}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid var(--border);z-index:100;max-width:480px;margin:0 auto}
.nav button{flex:1;background:none;border:none;padding:8px;color:var(--muted);font-size:.7rem;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.nav button.active{color:var(--p)}
.nav button svg{width:22px;height:22px}
.header{background:linear-gradient(135deg,var(--p),#8b5cf6);color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:50}
.header h1{font-size:1.1rem}
.header p{font-size:.75rem;opacity:.85;margin-top:2px}
.banner{background:#fef3c7;color:#92400e;padding:10px 16px;font-size:.8rem;text-align:center;border-bottom:1px solid #fcd34d}
.card{background:var(--card);margin:12px;border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 20px;border:none;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;width:100%}
.btn-p{background:var(--p);color:#fff}
.btn-s{background:var(--bg);color:var(--text)}
.btn-sm{padding:8px 14px;font-size:.85rem;width:auto}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:.95rem;margin-bottom:12px;font-family:inherit}
label{font-size:.85rem;font-weight:600;display:block;margin-bottom:4px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.role{border:2px solid var(--border);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;font-size:.75rem;font-weight:600}
.role.sel{border-color:var(--p);background:#eef2ff}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:700;text-transform:uppercase}
.b-client{background:#f3e8ff;color:#7c3aed}.b-vendeur{background:#dbeafe;color:#1d4ed8}.b-livreur{background:#dcfce7;color:#15803d}
.post-h{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.post-actions{display:flex;justify-content:space-around;border-top:1px solid var(--border);padding-top:10px;margin-top:10px}
.post-actions button{background:none;border:none;color:var(--muted);font-size:.8rem;font-weight:600;padding:6px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.product{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.product-img{height:100px;background:linear-gradient(135deg,#e0e7ff,#ede9fe);display:flex;align-items:center;justify-content:center;font-size:2rem}
.product-body{padding:10px}
.product-body h4{font-size:.85rem;margin-bottom:4px}
.price{color:var(--p);font-weight:700;font-size:1rem}
.msg-item{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer}
.msg-item:active{background:var(--bg)}
.chat{height:calc(100vh - 180px);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:75%;padding:10px 14px;border-radius:16px;font-size:.9rem;line-height:1.4}
.bubble.sent{align-self:flex-end;background:var(--p);color:#fff;border-bottom-right-radius:4px}
.bubble.recv{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.chat-input{display:flex;gap:8px;padding:12px;position:fixed;bottom:70px;left:0;right:0;background:var(--card);border-top:1px solid var(--border);max-width:480px;margin:0 auto}
.chat-input input{margin:0;flex:1}
.logo{width:64px;height:64px;margin:0 auto 12px;background:linear-gradient(135deg,var(--p),#8b5cf6);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:#fff}
.auth-page{padding:24px 16px}
.composer textarea{min-height:60px;resize:none;margin-bottom:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SERVER='https://kyriosboutique.page.gd';
const DB={get:k=>JSON.parse(localStorage.getItem('kyrios_'+k)||'null'),set:(k,v)=>localStorage.setItem('kyrios_'+k,JSON.stringify(v))};

function initData(){
  if(!DB.get('users')){
    DB.set('users',[
      {id:1,email:'demo.client@kyrios.local',pass:'password',name:'Marie Cliente',role:'client',bio:'Passionnée shopping'},
      {id:2,email:'demo.vendeur@kyrios.local',pass:'password',name:'Boutique Élégance',role:'vendeur',shop:'Élégance Mode',bio:'Mode tendance'},
      {id:3,email:'demo.livreur@kyrios.local',pass:'password',name:'Jean Livreur',role:'livreur',bio:'Livraison rapide'}
    ]);
    DB.set('products',[
      {id:1,sellerId:2,title:'Robe d\'été florale',price:49.99,cat:'mode'},
      {id:2,sellerId:2,title:'Sac à main cuir',price:89,cat:'accessoires'},
      {id:3,sellerId:2,title:'Baskets urbaines',price:65,cat:'chaussures'}
    ]);
    DB.set('posts',[
      {id:1,userId:2,content:'🌟 Nouvelle collection été disponible !',productId:1,likes:3,time:Date.now()-3600000},
      {id:2,userId:2,content:'Promotion -20% sur tous les sacs !',productId:2,likes:5,time:Date.now()-7200000},
      {id:3,userId:1,content:'Super expérience, livraison rapide 👍',likes:2,time:Date.now()-86400000}
    ]);
    DB.set('messages',{});
    DB.set('comments',{});
  }
}

let page='login', selRole='client', chatUser=null, postLikes=DB.get('likes')||{};

function badge(r){return `<span class="badge b-${r}">${r}</span>`}
function avi(n){return `<div class="avatar">${(n||'?')[0].toUpperCase()}</div>`}
function user(id){return(DB.get('users')||[]).find(u=>u.id===id)||{name:'?'}}
function fmt(t){const d=Date.now()-t;if(d<60000)return'À l\'instant';if(d<3600000)return Math.floor(d/60000)+' min';if(d<86400000)return Math.floor(d/3600000)+' h';return Math.floor(d/86400000)+' j'}

function render(){
  const app=document.getElementById('app');
  const me=DB.get('session');
  if(!me){renderAuth(app);return}

  if(page==='chat'&&chatUser){
    renderChat(app,me);return;
  }

  let html=`<div class="banner">📱 Mode local — Site: ${SERVER} (déployez le ZIP sur InfinityFree pour synchroniser)</div>`;
  html+=`<div class="header"><h1>Kyrios My Boutique</h1><p>${me.name} ${badge(me.role)}</p></div>`;

  if(page==='home') html+=renderHome(me);
  else if(page==='shop') html+=renderShop(me);
  else if(page==='msgs') html+=renderMsgs(me);
  else if(page==='profile') html+=renderProfile(me);

  html+=renderNav();
  app.innerHTML=html;
  bindEvents(me);
}

function renderNav(){
  const tabs=[['home','Accueil','M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3'],['shop','Boutique','M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z'],['msgs','Messages','M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z'],['profile','Profil','M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z']];
  return `<div class="nav">${tabs.map(([p,l,s])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${s}"/></svg>${l}</button>`).join('')}</div>`;
}

function renderAuth(app){
  if(page==='register'){
    app.innerHTML=`<div class="auth-page"><div class="card"><div class="logo">👑</div><h2 style="text-align:center;margin-bottom:16px">Créer un compte</h2>
      <label>Je suis :</label><div class="roles">
        ${['client','vendeur','livreur'].map(r=>`<div class="role ${selRole===r?'sel':''}" onclick="selRole='${r}';render()">${r.charAt(0).toUpperCase()+r.slice(1)}</div>`).join('')}
      </div>
      <label>Nom</label><input id="rName" placeholder="Jean Dupont">
      <label>Email</label><input id="rEmail" type="email" placeholder="email@exemple.com">
      <label>Mot de passe</label><input id="rPass" type="password" placeholder="Min. 6 caractères">
      ${selRole==='vendeur'?'<label>Boutique</label><input id="rShop" placeholder="Ma Boutique">':''}
      <button class="btn btn-p" onclick="doRegister()">Créer mon compte</button>
      <button class="btn btn-s" style="margin-top:8px" onclick="page='login';render()">Déjà un compte ? Connexion</button>
    </div></div>`;
  } else {
    app.innerHTML=`<div class="auth-page"><div class="card"><div class="logo">👑</div><h2 style="text-align:center;color:var(--p);margin-bottom:4px">Kyrios My Boutique</h2>
      <p style="text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:20px">Marketplace · Messagerie · Social</p>
      <div class="banner" style="margin:-16px -16px 16px;border-radius:0">⚠️ Site web non déployé — Mode local actif</div>
      <label>Email</label><input id="lEmail" type="email" value="demo.client@kyrios.local">
      <label>Mot de passe</label><input id="lPass" type="password" value="password">
      <button class="btn btn-p" onclick="doLogin()">Se connecter</button>
      <button class="btn btn-s" style="margin-top:8px" onclick="page='register';render()">Créer un compte</button>
      <p style="text-align:center;margin-top:12px;font-size:.75rem;color:var(--muted)">Demo: demo.client / demo.vendeur / demo.livreur<br>Mot de passe: password</p>
      <button class="btn btn-s btn-sm" style="margin-top:12px" onclick="retryServer()">🔄 Réessayer connexion serveur</button>
    </div></div>`;
  }
}

function renderHome(me){
  const posts=(DB.get('posts')||[]).sort((a,b)=>b.time-a.time);
  let h=`<div class="card composer"><textarea id="newPost" placeholder="Quoi de neuf ?"></textarea><button class="btn btn-p btn-sm" onclick="addPost()">Publier</button></div>`;
  posts.forEach(p=>{
    const u=user(p.userId);
    const prod=p.productId?(DB.get('products')||[]).find(x=>x.id===p.productId):null;
    const lk=postLikes[p.id]||p.likes||0;
    h+=`<div class="card"><div class="post-h">${avi(u.name)}<div><strong>${u.shop||u.name}</strong> ${badge(u.role)}<br><small style="color:var(--muted)">${fmt(p.time)}</small></div></div>
      <p style="margin-bottom:8px">${p.content}</p>
      ${prod?`<div style="border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px"><strong>${prod.title}</strong><div class="price">${prod.price} €</div></div>`:''}
      <div class="post-actions"><button onclick="likePost(${p.id})">❤️ ${lk}</button><button>💬 Commenter</button><button>↗️ Partager</button></div></div>`;
  });
  return h;
}

function renderShop(me){
  const prods=DB.get('products')||[];
  let h=`<div class="card"><h3>🛍️ Marketplace</h3></div><div class="grid" style="padding:0 12px">`;
  prods.forEach(p=>{
    const s=user(p.sellerId);
    h+=`<div class="product"><div class="product-img">🛍️</div><div class="product-body"><h4>${p.title}</h4><small style="color:var(--muted)">${s.shop||s.name}</small><div class="price">${p.price} €</div>
      <button class="btn btn-p btn-sm" style="margin-top:6px" onclick="orderProd(${p.id})">Commander</button></div></div>`;
  });
  return h+'</div>';
}

function renderMsgs(me){
  const users=(DB.get('users')||[]).filter(u=>u.id!==me.id);
  let h=`<div class="card"><h3>💬 Messagerie</h3></div>`;
  users.forEach(u=>{
    const msgs=(DB.get('messages')||{})[me.id+'-'+u.id]||[];
    const last=msgs[msgs.length-1];
    h+=`<div class="msg-item" onclick="openChat(${u.id})">${avi(u.name)}<div><strong>${u.shop||u.name}</strong> ${badge(u.role)}<br><small style="color:var(--muted)">${last?last.text:'Nouvelle conversation'}</small></div></div>`;
  });
  return h;
}

function renderChat(app,me){
  const u=user(chatUser);
  const key=me.id+'-'+chatUser;
  const msgs=(DB.get('messages')||{})[key]||[];
  app.innerHTML=`<div class="header"><button onclick="chatUser=null;page='msgs';render()" style="background:none;border:none;color:#fff;font-size:1.2rem;position:absolute;left:16px;top:16px;cursor:pointer">←</button>
    <h1>${u.shop||u.name}</h1><p>${u.role}</p></div>
    <div class="chat" id="chatBox">${msgs.map(m=>`<div class="bubble ${m.from===me.id?'sent':'recv'}">${m.text}</div>`).join('')}</div>
    <div class="chat-input"><input id="msgInput" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="btn btn-p btn-sm" onclick="sendMsg()">➤</button></div>`;
  setTimeout(()=>{const b=document.getElementById('chatBox');if(b)b.scrollTop=b.scrollHeight},50);
}

function renderProfile(me){
  return `<div class="card" style="text-align:center">${avi(me.name).replace('40px','80px').replace('width:40px;height:40px','width:80px;height:80px;font-size:2rem;margin:0 auto 12px')}
    <h2>${me.name}</h2>${badge(me.role)}<p style="color:var(--muted);margin:8px 0">${me.bio||''}</p>
    ${me.shop?`<p><strong>Boutique:</strong> ${me.shop}</p>`:''}
    <button class="btn btn-s" style="margin-top:16px" onclick="doLogout()">Se déconnecter</button>
    <button class="btn btn-s btn-sm" style="margin-top:8px" onclick="retryServer()">🔄 Connexion serveur en ligne</button></div>`;
}

function bindEvents(me){}

function go(p){page=p;chatUser=null;render()}
function doLogin(){
  const e=document.getElementById('lEmail').value,p=document.getElementById('lPass').value;
  const u=(DB.get('users')||[]).find(x=>x.email===e&&x.pass===p);
  if(u){DB.set('session',u);page='home';render()}else alert('Email ou mot de passe incorrect')
}
function doRegister(){
  const name=document.getElementById('rName').value,e=document.getElementById('rEmail').value,p=document.getElementById('rPass').value;
  if(!name||!e||!p||p.length<6){alert('Remplissez tous les champs (mdp min 6)');return}
  const users=DB.get('users')||[];
  if(users.find(x=>x.email===e)){alert('Email déjà utilisé');return}
  const u={id:Date.now(),email:e,pass:p,name,role:selRole,shop:selRole==='vendeur'?document.getElementById('rShop')?.value:'',bio:''};
  users.push(u);DB.set('users',users);DB.set('session',u);page='home';render();
}
function doLogout(){DB.set('session',null);page='login';render()}
function addPost(){
  const t=document.getElementById('newPost').value.trim();if(!t)return;
  const me=DB.get('session');const posts=DB.get('posts')||[];
  posts.unshift({id:Date.now(),userId:me.id,content:t,likes:0,time:Date.now()});
  DB.set('posts',posts);render();
}
function likePost(id){postLikes[id]=(postLikes[id]||0)+1;DB.set('likes',postLikes);render()}
function openChat(uid){chatUser=uid;page='chat';render()}
function sendMsg(){
  const t=document.getElementById('msgInput').value.trim();if(!t)return;
  const me=DB.get('session');const key=me.id+'-'+chatUser;
  const all=DB.get('messages')||{};if(!all[key])all[key]=[];
  all[key].push({from:me.id,text:t,time:Date.now()});DB.set('messages',all);
  render();
}
function orderProd(id){
  const p=(DB.get('products')||[]).find(x=>x.id===id);
  alert('✅ Commande passée: '+p.title+' — '+p.price+' €');
}
function retryServer(){
  if(confirm('Tenter de se connecter au serveur en ligne ?\n\n(Le site doit être déployé sur InfinityFree)')){
    location.href=SERVER+'/login.php';
  }
}
function handleBack(){
  if(chatUser){chatUser=null;page='msgs';render();return true}
  if(page!=='home'&&DB.get('session')){page='home';render();return true}
  return false;
}

initData();
if(DB.get('session'))page='home';
render();
</script>
</body>
</html>
