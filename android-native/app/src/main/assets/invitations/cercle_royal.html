<div class="poster poster-cercle-royal">
  <div class="cr-bg-pattern"></div>
  <div class="cr-ring-outer"></div>
  <div class="cr-ring-inner">
    <img class="cr-photo" data-bind="couple" src="" alt="Moïse & Sarah"/>
  </div>
  <div class="cr-crown">👑</div>

  <h1 class="cr-title">Invitation</h1>
  <div class="cr-gold-line"></div>

  <div class="cr-guest-block">
    <span class="cr-prefix">Mme, Mlle, Mr, Couple :</span>
    <div class="cr-guest-name" data-bind="guest">Nom invité</div>
  </div>
  <div class="cr-table" data-bind-table>Table <strong data-bind="table">—</strong></div>

  <p class="cr-intro">Les familles NKUBA &amp; BANZA vous invitent<br/>au mariage civil de</p>
  <div class="cr-names">Moïse NKUBA<br/><span class="cr-amp">&amp;</span><br/>Sarah KASONGO</div>

  <div class="cr-info-grid">
    <div class="cr-info"><div class="cr-info-lbl">Date</div><div data-bind="date">11 Septembre 2026</div></div>
    <div class="cr-info"><div class="cr-info-lbl">Heure</div><div data-bind="time">11h00</div></div>
    <div class="cr-info cr-info-wide"><div class="cr-info-lbl">Lieu</div><div data-bind="venue">Kipushi</div></div>
  </div>

  <div class="cr-seats" data-bind-seats><span data-bind="seats">2</span> place(s)<span class="seats-table-part"> • Table <span data-bind="table2">—</span></span></div>

  <div class="qr-zone cr-qr">
    <div class="qr-box"><div data-bind="qr" class="qr-canvas"></div></div>
    <div class="qr-label">Scannez pour valider</div>
  </div>
</div>
