<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200, height=1700"/>
<style>
@font-face { font-family: 'Great Vibes'; src: url('file:///android_asset/fonts/GreatVibes.ttf'); }
@font-face { font-family: 'Playfair'; src: url('file:///android_asset/fonts/PlayfairDisplay-Regular.ttf'); }
@font-face { font-family: 'Playfair'; font-weight: 700; src: url('file:///android_asset/fonts/PlayfairDisplay.ttf'); }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1200px; height:1700px; overflow:hidden; background:#fff; }
.poster { width:1200px; height:1700px; position:relative; }
.bg-affiche { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.couple-logo {
  position:absolute; left:40px; top:40px; width:200px; height:260px;
  object-fit:cover; object-position:center top; z-index:3;
  border:3px solid #D4B896; border-radius:16px; background:#fff;
  box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
.guest-name {
  position:absolute; top:295px; left:490px; width:660px; z-index:5;
  font-family:'Playfair',Georgia,serif; font-size:34px; font-weight:700;
  color:#1a1a1a; line-height:1.2;
}
.table-badge {
  position:absolute; top:220px; left:60px; width:400px; text-align:center; z-index:5;
  font-family:'Playfair',Georgia,serif; font-size:28px; color:#333;
}
.table-badge span {
  font-weight:700; color:#6B2D82; border-bottom:3px dotted #999; padding:0 16px;
}
.date-line, .time-line, .venue-line {
  position:absolute; left:490px; width:660px; z-index:5;
  font-family:'Playfair',Georgia,serif; font-size:22px; color:#222;
}
.date-line { top:920px; }
.time-line { top:980px; }
.venue-line { top:1040px; line-height:1.4; }
.seats-badge {
  position:absolute; bottom:340px; right:60px; z-index:5;
  font-size:18px; font-weight:700; color:#6B2D82;
}
.qr-zone {
  position:absolute; left:50px; bottom:70px; z-index:10;
  width:{{QR_SIZE}}px; text-align:center;
}
.qr-box {
  width:{{QR_SIZE}}px; height:{{QR_SIZE}}px;
  background:#fff; padding:10px; border-radius:14px;
  border:3px solid #6B2D82;
  box-shadow:0 6px 28px rgba(107,45,130,0.35);
}
.qr-box img { width:100%; height:100%; display:block; }
.qr-label {
  margin-top:8px; font-family:'Playfair',Georgia,serif;
  font-size:16px; font-weight:700; color:#6B2D82;
}
</style>
</head>
<body>
<div class="poster">
  <img class="bg-affiche" src="{{POSTER_BG}}" alt="Affiche"/>
  <div class="table-badge">Table <span>{{TABLE}}</span></div>
  <div class="guest-name">{{GUEST_NAME}}</div>
  <div class="date-line"><strong>Date :</strong> {{EVENT_DATE}}</div>
  <div class="time-line"><strong>Heure :</strong> {{EVENT_TIME}}</div>
  <div class="venue-line"><strong>Lieu :</strong> {{EVENT_VENUE}}</div>
  <div class="seats-badge">{{SEATS}} place(s) • Table {{TABLE}}</div>
  <div class="qr-zone">
    <div class="qr-box"><img src="{{QR_DATA}}" alt="QR Code invitation"/></div>
    <div class="qr-label">Scannez pour valider</div>
  </div>
</div>
</body>
</html>
