<div class="poster mariage-civil-poster">
  <img class="bg-affiche" data-bind="poster" src="" alt="Affiche"/>
  <div class="guest-block">
    <div class="guest-line">
      <span class="guest-prefix">Mme, Mlle, Mr, Couple :</span>
      <span class="guest-name" data-bind="guest">Nom invité</span>
    </div>
  </div>
  <div class="table-badge">Table <span data-bind="table">—</span></div>
  <div class="seats-badge"><span data-bind="seats">1</span> place(s) • Table <span data-bind="table2">—</span></div>
  <div class="qr-zone">
    <div class="qr-box"><div data-bind="qr" class="qr-canvas" aria-label="QR Code"></div></div>
    <div class="qr-label">Scannez pour valider</div>
  </div>
</div>
