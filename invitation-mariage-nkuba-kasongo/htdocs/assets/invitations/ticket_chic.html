<div class="poster poster-ticket-chic">
  <div class="ticket-notch ticket-notch-tl"></div>
  <div class="ticket-notch ticket-notch-tr"></div>
  <div class="ticket-notch ticket-notch-bl"></div>
  <div class="ticket-notch ticket-notch-br"></div>
  <div class="ticket-perforation"></div>

  <div class="ticket-left">
    <div class="ticket-photo-frame">
      <img data-bind="couple" src="" alt="Moïse & Sarah"/>
    </div>
    <div class="ticket-qr-wrap">
      <div class="qr-box"><div data-bind="qr" class="qr-canvas"></div></div>
      <div class="qr-label">Scannez pour valider</div>
    </div>
  </div>

  <div class="ticket-right">
    <div class="ticket-header">ADMIT ONE</div>
    <h1 class="ticket-title">Invitation</h1>
    <p class="ticket-event">Mariage Civil — Moïse &amp; Sarah</p>

    <div class="ticket-guest">
      <span class="ticket-guest-lbl">Invité</span>
      <span class="ticket-guest-name" data-bind="guest">Nom invité</span>
    </div>
    <div class="ticket-meta">
      <span data-bind-table>Table <strong data-bind="table">—</strong></span>
      <span data-bind-seats><span data-bind="seats">2</span> place(s)<span class="seats-table-part"> • T.<span data-bind="table2">—</span></span></span>
    </div>

    <div class="ticket-details">
      <div><strong>Date</strong><br/><span data-bind="date">Vendredi, le 11 Septembre 2026</span></div>
      <div><strong>Heure</strong><br/><span data-bind="time">11h00</span></div>
      <div class="ticket-venue"><strong>Lieu</strong><br/><span data-bind="venue">Commune de Kipushi</span></div>
    </div>

    <p class="ticket-footer">Votre présence fera notre immense joie.</p>
  </div>
</div>
