name: Build Lumen Reader APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'cursor/lumen-reader-apk-1d69'
      - 'cursor/pdf-reader-interface-1d69'
    paths:
      - 'pdf-reader/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pdf-reader

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pdf-reader/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-reader-apk
          path: pdf-reader/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
