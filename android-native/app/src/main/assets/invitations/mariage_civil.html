<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=1200"/>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet"/>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 1700px; background: #fff; overflow: hidden; }
.card {
  width: 1200px; height: 1700px; position: relative;
  background: url('file:///android_asset/posters/mariage_civil_bg.png') center/cover no-repeat;
}
.overlay-name {
  position: absolute; left: 520px; top: 230px; width: 640px;
  font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700;
  color: #2c2c2c; border-bottom: 2px dotted #aaa; padding-bottom: 8px;
}
.overlay-table {
  position: absolute; left: 60px; top: 160px; width: 400px; text-align: center;
  font-family: 'Playfair Display', serif; font-size: 24px; color: #6B2D82;
}
.qr-box {
  position: absolute; left: 70px; bottom: 200px;
  width: {{QR_SIZE}}px; height: {{QR_SIZE}}px;
  background: #fff; padding: 8px; border-radius: 8px;
  box-shadow: 0 4px 16px rgba(107,45,130,0.25);
}
.qr-box img { width: 100%; height: 100%; }
.seats { position: absolute; left: 520px; bottom: 120px; font-size: 16px; color: #6B2D82; font-weight: 700; }
</style>
</head>
<body>
<div class="card">
  <div class="overlay-table">Table {{TABLE}} • {{SEATS}} place(s)</div>
  <div class="overlay-name">Mme, Mlle, Mr, Couple : {{GUEST_NAME}}</div>
  <div class="qr-box"><img src="{{QR_DATA}}" alt="QR"/></div>
  <div class="seats">{{SEATS}} place(s) — {{TABLE}}</div>
</div>
</body>
</html>
